<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="探索 3D 虛擬導覽 - 體驗不同文化的建築之美" />
  <title>3D 虛擬導覽門戶</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 2rem;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    .container {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      width: 300px;
      height: 400px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.4s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: white;
      backdrop-filter: blur(10px);
    }

    .card:hover {
      transform: translateY(-15px) scale(1.05);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .card-img {
      height: 200px;
      background-size: cover;
      background-position: center;
    }

    .church-img {
      background-color: #2c3e50;
      background-image: url('https://images.unsplash.com/photo-1438232992991-995b7058bbb3?auto=format&fit=crop&w=400&q=80');
    }

    .temple-img {
      background-color: #c0392b;
      background-image: url('https://images.unsplash.com/photo-1547841022-b558accc7ee8?auto=format&fit=crop&w=400&q=80');
    }

    .warehouse-img {
      background-color: #2d572c;
      background-image: url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=400&q=80');
    }

    .card-content {
      padding: 1.5rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .card-desc {
      font-size: 0.9rem;
      opacity: 0.7;
      line-height: 1.4;
    }

    .btn {
      margin-top: 1rem;
      padding: 0.8rem;
      background: white;
      color: black;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      transition: background 0.3s;
    }

    .card:hover .btn {
      background: #f1c40f;
    }
  </style>
</head>

<body>
  <h1>🕌 選擇您的 3D 體驗</h1>
  <div class="container">
    <a href="church.html" class="card">
      <div class="card-img church-img"></div>
      <div class="card-content">
        <div>
          <div class="card-title">西式大教堂</div>
          <div class="card-desc">探索壯麗的哥德式建築，體驗神聖與安寧的氛圍。</div>
        </div>
        <div class="btn">進入導覽</div>
      </div>
    </a>
    <a href="temple.html" class="card">
      <div class="card-img temple-img"></div>
      <div class="card-content">
        <div>
          <div class="card-title">中式廟宇</div>
          <div class="card-desc">體驗傳統紅牆綠瓦、雕樑畫棟的東方寺廟藝術。</div>
        </div>
        <div class="btn">進入導覽</div>
      </div>
    </a>
    <a href="warehouse.html" class="card">
      <div class="card-img warehouse-img"></div>
      <div class="card-content">
        <div>
          <div class="card-title">3D 倉庫空間</div>
          <div class="card-desc">立體儲位配置展示，視覺化倉儲庫存與空間管理。</div>
        </div>
        <div class="btn">進入導覽</div>
      </div>
    </a>
  </div>
</body>

</html>
